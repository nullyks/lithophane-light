name: Firmware and web UI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: 1.5.1
      - name: Install pinned board and library
        run: |
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2 --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli lib install "Adafruit NeoPixel@1.15.5"
      - name: Compile NodeMCU firmware
        run: arduino-cli compile --fqbn esp8266:esp8266:nodemcuv2 --warnings all Lithophane_Light
      - name: Test embedded web script
        run: node --test tests/web-ui.test.cjs
